<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metrics Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1220;
        --panel: #111827;
        --panel-border: #1f2937;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-hover: #0ea5e9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 32px;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: linear-gradient(180deg, #020617 0%, var(--bg) 100%);
        color: var(--text);
      }

      main {
        max-width: 960px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      #links {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
        margin-top: 24px;
      }

      .card {
        display: block;
        padding: 20px;
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        background: rgba(17, 24, 39, 0.9);
        color: inherit;
        text-decoration: none;
        transition:
          transform 140ms ease,
          border-color 140ms ease,
          background 140ms ease;
      }

      .card:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
        background: rgba(15, 23, 42, 0.98);
      }

      .card-title {
        margin: 0 0 8px;
        font-size: 1.1rem;
      }

      .card-url {
        color: var(--accent);
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Metrics Dashboard</h1>
      <p>Entry point for internal observability UIs.</p>
      <section id="links" aria-label="Dashboard links"></section>
    </main>

    <script>
      const links = [
        {
          name: "Traefik Dashboard",
          url: "https://metrics.kwer.fr/traefik/dashboard/",
        },
        {
          name: "Traefik Metrics",
          url: "https://metrics.kwer.fr/traefik/metrics",
        },
        {
          name: "Longhorn UI",
          url: "https://metrics.kwer.fr/longhorn/",
        },
        {
          name: "ArgoCD",
          url: "https://metrics.kwer.fr/argocd",
        },
        {
          name: "Loki",
          url: "https://metrics.kwer.fr/loki",
        },
      ];

      function renderLinks() {
        const container = document.getElementById("links");

        links.forEach(({ name, url }) => {
          const anchor = document.createElement("a");
          anchor.className = "card";
          anchor.href = url;
          anchor.target = "_blank";
          anchor.rel = "noreferrer";
          anchor.innerHTML = `
            <h2 class="card-title">${name}</h2>
            <div class="card-url">${url}</div>
          `;
          container.appendChild(anchor);
        });
      }

      renderLinks();
    </script>
  </body>
</html>
