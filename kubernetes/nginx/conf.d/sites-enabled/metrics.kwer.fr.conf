server {
    server_name metrics.kwer.fr;

    location / {
        include /etc/nginx/conf.d/snippets/proxy-traefik.conf;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/metrics.kwer.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/metrics.kwer.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = metrics.kwer.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name metrics.kwer.fr;
    listen 80;
    return 404; # managed by Certbot


}