apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: metrics-loki-route
  namespace: traefik
spec:
  parentRefs:
    - name: cluster-edge-gateway
      namespace: traefik
  hostnames:
    - metrics.kwer.fr
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /loki
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: strip-first-segment
            namespace: traefik
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: metrics-basic-auth
            namespace: traefik
      backendRefs:
        - name: loki
          port: 3100
          namespace: metrics
