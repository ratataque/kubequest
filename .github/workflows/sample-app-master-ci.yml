name: sample-app-master-ci

on:
  pull_request:
    types:
      - closed
    branches:
      - dev
    paths:
      - services/sample-app-master/**
      - .github/workflows/sample-app-master-ci.yml

jobs:
  test:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sample-app-master
    env:
      APP_ENV: testing
      APP_DEBUG: true
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://localhost
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/sample-app-master.sqlite
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/sample-app-master/package-lock.json

      - name: Prepare environment
        run: |
          cp .env.example .env
          touch "$DB_DATABASE"

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run production

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon --no-progress

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run test suite
        run: php artisan test

  docker:
    if: github.event.pull_request.merged == true
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Resolve release context
        id: context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_core_version=$(python3 -c "import re, pathlib; content = pathlib.Path('gitops/charts/sample-app/values-dev.yaml').read_text(encoding='utf-8'); match = re.search(r'^  tag:\\s*([0-9]+\\.[0-9]+\\.[0-9]+)(?:[-+].*)?\\s*$', content, flags=re.MULTILINE); print(match.group(1) if match else '0.0.0')")

          pr_number='${{ github.event.pull_request.number }}'
          release_labels=$(gh pr view "$pr_number" --json labels --jq '.labels[].name' | tr '[:upper:]' '[:lower:]' | grep -E '^(version-major|version-minor|version-hot)$' || true)
          release_label_count=$(printf '%s\n' "$release_labels" | sed '/^$/d' | wc -l | tr -d ' ')

          if [ "$release_label_count" = "1" ]; then
            release_label=$(printf '%s\n' "$release_labels" | sed '/^$/d' | head -n 1)
            current_release=$(python3 -c "import re, subprocess; output = subprocess.check_output(['git', 'tag', '--list', 'v*'], text=True); versions = [tuple(int(x) for x in m.groups()) for line in output.splitlines() if (m := re.fullmatch(r'v(\\d+)\\.(\\d+)\\.(\\d+)', line.strip()))]; print('.'.join(map(str, max(versions))) if versions else '0.0.0')")

            next_version=$(CURRENT_VERSION="$current_release" RELEASE_LABEL="$release_label" python3 -c "import os; major, minor, patch = [int(x) for x in os.environ['CURRENT_VERSION'].split('.')]; label = os.environ['RELEASE_LABEL']; mapping = {'version-major': (major + 1, 0, 0), 'version-minor': (major, minor + 1, 0), 'version-hot': (major, minor, patch + 1)}; print('.'.join(map(str, mapping[label]))) if label in mapping else (_ for _ in ()).throw(SystemExit(f'Unsupported release label: {label}'))")

            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "chart_version=$next_version" >> "$GITHUB_OUTPUT"
            echo "chart_app_version=$next_version" >> "$GITHUB_OUTPUT"
            echo "release_tag=v$next_version" >> "$GITHUB_OUTPUT"
          else
            short_sha=$(printf '%s' '${{ github.event.pull_request.merge_commit_sha }}' | cut -c1-12)
            dev_version="${current_core_version}-dev.${short_sha}"
            echo "mode=dev" >> "$GITHUB_OUTPUT"
            echo "chart_version=$dev_version" >> "$GITHUB_OUTPUT"
            echo "chart_app_version=$dev_version" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to registry.kwer.fr
        uses: docker/login-action@v3
        with:
          registry: registry.kwer.fr
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Prepare image tags
        id: tags
        run: |
          if [ "${{ steps.context.outputs.mode }}" = "release" ]; then
            {
              echo 'tags<<EOF'
              echo 'registry.kwer.fr/kubequest/dev/sample-app-master:${{ steps.context.outputs.chart_app_version }}'
              echo 'registry.kwer.fr/kubequest/prod/sample-app-master:${{ steps.context.outputs.chart_app_version }}'
              echo 'registry.kwer.fr/kubequest/dev/sample-app-master:sha-${{ github.event.pull_request.merge_commit_sha }}'
              echo 'registry.kwer.fr/kubequest/prod/sample-app-master:sha-${{ github.event.pull_request.merge_commit_sha }}'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'tags<<EOF'
              echo 'registry.kwer.fr/kubequest/dev/sample-app-master:${{ steps.context.outputs.chart_app_version }}'
              echo 'registry.kwer.fr/kubequest/dev/sample-app-master:sha-${{ github.event.pull_request.merge_commit_sha }}'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create git release tag
        if: steps.context.outputs.mode == 'release'
        run: |
          if git rev-parse "${{ steps.context.outputs.release_tag }}" >/dev/null 2>&1; then
            echo "Git tag ${{ steps.context.outputs.release_tag }} already exists"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.context.outputs.release_tag }}"
          git push origin "${{ steps.context.outputs.release_tag }}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/sample-app-master
          file: services/sample-app-master/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update chart version
        run: |
          APP_VERSION='${{ steps.context.outputs.chart_app_version }}' MODE='${{ steps.context.outputs.mode }}' python3 -c "import os, re, pathlib; app_version = os.environ['APP_VERSION']; mode = os.environ['MODE']; dev_path = pathlib.Path('gitops/charts/sample-app/values-dev.yaml'); dev_values = dev_path.read_text(encoding='utf-8'); dev_values = re.sub(r'(^image:\n(?:  .*\n)*?  tag:\s*).+$', rf'\g<1>{app_version}', dev_values, flags=re.MULTILINE); dev_values = re.sub(r'(^migration:\n(?:  .*\n)*?  releaseId:\s*).+$', rf'\g<1>{app_version}', dev_values, flags=re.MULTILINE); dev_path.write_text(dev_values, encoding='utf-8'); prod_path = pathlib.Path('gitops/charts/sample-app/values-prod.yaml'); prod_values = prod_path.read_text(encoding='utf-8'); prod_values = re.sub(r'(^image:\n(?:  .*\n)*?  tag:\s*).+$', rf'\g<1>{app_version}', prod_values, flags=re.MULTILINE); prod_values = re.sub(r'(^migration:\n(?:  .*\n)*?  releaseId:\s*).+$', rf'\g<1>{app_version}', prod_values, flags=re.MULTILINE); prod_path.write_text(prod_values, encoding='utf-8') if mode == 'release' else None"

      - name: Commit chart version update
        run: |
          if git diff --quiet -- gitops/charts/sample-app/values-dev.yaml gitops/charts/sample-app/values-prod.yaml; then
            echo "No sample-app version changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/charts/sample-app/values-dev.yaml gitops/charts/sample-app/values-prod.yaml
          git commit -m "chore(sample-app): set app version ${{ steps.context.outputs.chart_app_version }}"
          git push

      - name: Promote dev to main
        if: steps.context.outputs.mode == 'release'
        run: |
          git fetch origin main dev
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff origin/dev -m "chore(sample-app): promote release ${{ steps.context.outputs.chart_app_version }} to main"
          git push origin main
