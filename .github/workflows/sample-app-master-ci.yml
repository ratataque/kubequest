name: sample-app-master-ci

on:
  pull_request:
    types:
      - closed
    branches:
      - dev
    paths:
      - services/sample-app-master/**
      - .github/workflows/sample-app-master-ci.yml

jobs:
  test:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sample-app-master
    env:
      APP_ENV: testing
      APP_DEBUG: true
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://localhost
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/sample-app-master.sqlite
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/sample-app-master/package-lock.json

      - name: Prepare environment
        run: |
          cp .env.example .env
          touch "$DB_DATABASE"

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run production

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon --no-progress

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run test suite
        run: php artisan test

  docker:
    if: github.event.pull_request.merged == true
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Resolve release context
        id: context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_core_version=$(python3 - <<'PY'
          import re
          from pathlib import Path

          content = Path('gitops/charts/sample-app/values-dev.yaml').read_text(encoding='utf-8')
          match = re.search(r'^  tag:\s*([0-9]+\.[0-9]+\.[0-9]+)(?:[-+].*)?\s*$', content, flags=re.MULTILINE)
          if match:
              print(match.group(1))
          else:
              print('0.0.0')
          PY
          )

          pr_number='${{ github.event.pull_request.number }}'
          release_labels=$(gh pr view "$pr_number" --json labels --jq '.labels[].name' | tr '[:upper:]' '[:lower:]' | grep -E '^(version-major|version-minor|version-hot)$' || true)
          release_label_count=$(printf '%s\n' "$release_labels" | sed '/^$/d' | wc -l | tr -d ' ')

          if [ "$release_label_count" = "1" ]; then
            release_label=$(printf '%s\n' "$release_labels" | sed '/^$/d' | head -n 1)
            current_release=$(python3 - <<'PY'
            import re
            import subprocess

            output = subprocess.check_output(['git', 'tag', '--list', 'v*'], text=True)
            versions = []
            for raw in output.splitlines():
                match = re.fullmatch(r'v(\d+)\.(\d+)\.(\d+)', raw.strip())
                if match:
                    versions.append(tuple(int(x) for x in match.groups()))

            if versions:
                major, minor, patch = max(versions)
                print(f'{major}.{minor}.{patch}')
            else:
                print('0.0.0')
            PY
            )

            next_version=$(CURRENT_VERSION="$current_release" RELEASE_LABEL="$release_label" python3 - <<'PY'
            import os

            major, minor, patch = [int(x) for x in os.environ['CURRENT_VERSION'].split('.')]
            label = os.environ['RELEASE_LABEL']

            if label == 'version-major':
                major, minor, patch = major + 1, 0, 0
            elif label == 'version-minor':
                major, minor, patch = major, minor + 1, 0
            elif label == 'version-hot':
                major, minor, patch = major, minor, patch + 1
            else:
                raise SystemExit(f'Unsupported release label: {label}')

            print(f'{major}.{minor}.{patch}')
            PY
            )

            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "chart_version=$next_version" >> "$GITHUB_OUTPUT"
            echo "chart_app_version=$next_version" >> "$GITHUB_OUTPUT"
            echo "release_tag=v$next_version" >> "$GITHUB_OUTPUT"
          else
            short_sha=$(printf '%s' '${{ github.event.pull_request.merge_commit_sha }}' | cut -c1-12)
            dev_version="${current_core_version}-dev.${short_sha}"
            echo "mode=dev" >> "$GITHUB_OUTPUT"
            echo "chart_version=$dev_version" >> "$GITHUB_OUTPUT"
            echo "chart_app_version=$dev_version" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to registry.kwer.fr
        uses: docker/login-action@v3
        with:
          registry: registry.kwer.fr
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Create git release tag
        if: steps.context.outputs.mode == 'release'
        run: |
          if git rev-parse "${{ steps.context.outputs.release_tag }}" >/dev/null 2>&1; then
            echo "Git tag ${{ steps.context.outputs.release_tag }} already exists"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.context.outputs.release_tag }}"
          git push origin "${{ steps.context.outputs.release_tag }}"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: registry.kwer.fr/kubequest/dev/sample-app-master
          tags: |
            type=raw,value=${{ steps.context.outputs.chart_app_version }}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/sample-app-master
          file: services/sample-app-master/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update chart version
        run: |
          APP_VERSION='${{ steps.context.outputs.chart_app_version }}' python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          app_version = os.environ['APP_VERSION']

          values_path = Path('gitops/charts/sample-app/values-dev.yaml')
          values = values_path.read_text(encoding='utf-8')
          values = re.sub(r'(^image:\n(?:  .*\n)*?  tag:\s*).+$', rf'\g<1>{app_version}', values, flags=re.MULTILINE)
          values = re.sub(r'(^migration:\n(?:  .*\n)*?  releaseId:\s*).+$', rf'\g<1>{app_version}', values, flags=re.MULTILINE)
          values_path.write_text(values, encoding='utf-8')
          PY

      - name: Commit chart version update
        run: |
          if git diff --quiet -- gitops/charts/sample-app/values-dev.yaml; then
            echo "No values-dev version changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/charts/sample-app/values-dev.yaml
          git commit -m "chore(sample-app): set dev app version ${{ steps.context.outputs.chart_app_version }}"
          git push
