{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sample-app.secretName" . }}
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_ENV: {{ .Values.secret.data.APP_ENV | quote }}
  APP_DEBUG: {{ .Values.secret.data.APP_DEBUG | quote }}
  APP_KEY: {{ required "secret.data.APP_KEY is required" .Values.secret.data.APP_KEY | quote }}
  DB_CONNECTION: {{ .Values.secret.data.DB_CONNECTION | quote }}
  DB_HOST: {{ required "secret.data.DB_HOST is required" .Values.secret.data.DB_HOST | quote }}
  DB_PORT: {{ .Values.secret.data.DB_PORT | quote }}
  DB_DATABASE: {{ required "secret.data.DB_DATABASE is required" .Values.secret.data.DB_DATABASE | quote }}
  DB_USERNAME: {{ required "secret.data.DB_USERNAME is required" .Values.secret.data.DB_USERNAME | quote }}
  DB_PASSWORD: {{ required "secret.data.DB_PASSWORD is required" .Values.secret.data.DB_PASSWORD | quote }}
{{- end }}
