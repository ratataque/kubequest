apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-dashboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ratataque/kubequest
    targetRevision: main
    path: gitops/charts/metrics-dashboard
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: metrics
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
